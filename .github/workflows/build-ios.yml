name: Build AetherScan Pro iOS (IPA)

on:
  push:
    branches: [ ghost_friends-italia, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Framework / Runner
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AetherScan-Pro-v26-beta3-unsigned.ipa Payload
          mkdir -p release-ios
          mv AetherScan-Pro-v26-beta3-unsigned.ipa release-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherScan-Pro-iOS-IPA
          path: release-ios/*.ipa
