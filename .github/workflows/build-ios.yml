name: Build AetherScan Pro iOS (IPA) - Beta 1

on:
  push:
    branches: [ ghost_friends-italia, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Framework / Runner
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AetherScan-Pro-v26-beta1-unsigned.ipa Payload
          mkdir -p release-ios
          mv AetherScan-Pro-v26-beta1-unsigned.ipa release-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherScan-Pro-iOS-IPA
          path: release-ios/*.ipa

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v26-beta1
          name: "AetherScan Pro v26 Beta 1"
          body: |
            ## AetherScan Pro v26 Beta 1

            ### Fix inclusi in questa versione:
            - TTS iOS 17+ risolto: rimosso duckOthers, conflitto con AVSpeechSynthesizer
            - Voice fallback: se voce italiana non scaricata usa inglese o voce sistema
            - setActive() mirato: sessione audio attivata solo prima di parlare
            - License persiste: synchronize() dopo salvataggio, evita perdita su force-quit
            - Android TTS race condition: speech in coda se arriva prima di onInit
            - Android TTS volume: rimosso parametro deprecato API 35+
            - Bottone unificato: TESTA VOCE valido su iOS e Android

            ### Installazione
            Scarica l\'IPA e installa via Sideloadly o SideStore/AltStore.
          files: release-ios/*.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
